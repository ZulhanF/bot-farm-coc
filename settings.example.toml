# Copy to settings.toml and adjust. Every key is optional; defaults are shown.

[adb]
serial = "127.0.0.1:5555"
adb_path = ""            # empty = auto-detect (LDPlayer folder, then PATH)
package = "com.supercell.clashofclans"

[loot]
min_gold = 300000
min_elixir = 300000
min_de = 0
max_next = 50            # after this many skips, attack the current base anyway

[deploy]
pattern = "v_top"        # "all" (diamond) or "v_top" (left & right wings)
sides = 2                # how many diamond edges to deploy along (1-4)
points_per_side = 5
taps_per_point = 1       # sides * points_per_side * taps_per_point should be >= troops per slot
troop_slots = [1]        # troop card slots to deploy (calibrate troop_slot_N for each)
siege_slot = 2           # slot for siege machine (0 = disabled)
hero_slots = [3, 4, 5]   # hero slots to deploy and immediately trigger ability
outward_px = 20          # push deploy points this far outside the map edge
max_y = 600              # never tap below this y (troop bar)

[spells]
# Spells (e.g. Rage) dropped in rows like the troops, shifted forward, once per battle.
# Calibrate point map_center (middle of the enemy base) and troop_slot_N for each spell card.
slots = []               # spell card slots, e.g. [6] for Rage in slot 6; empty = no spells
casts = 2                # spells per slot, split over the left / right rows (4 = 2 per row)
delay_s = 5.0            # seconds after the troops are deployed
depth = 0.35             # how far the rows move forward: 0 = on the troop line, 1 = at map_center

[timing]
tap_delay_ms = [120, 350]
tap_jitter_px = 4
battle_timeout_s = 60
damage_stagnant_s = 5.0  # surrender if damage percentage does not increase for this many seconds
stuck_timeout_s = 60
max_restarts = 3
progress_timeout_s = 900  # no forward progress (screen transition / rest) for this long -> recover

[session]
enabled = false          # false to run continuously without sleeping
play_minutes = [40, 70]
break_minutes = [10, 25]
active_hours = ["08:00", "23:00"]
max_hours_per_day = 10.0

[storage]
# Storage-full check on the home village, before every attack. Easiest: calibrate the coloured bars
# (roi home_gold_bar / home_elixir_bar / home_de_bar, without the icon) - no capacity needed.
# Fallback per resource: set its cap and calibrate the counter (roi home_gold / ...). 0 = no cap.
gold_cap = 0
elixir_cap = 0
de_cap = 0
full_ratio = 0.95        # full when every checked storage is at least this full
on_full = "stop"         # "stop" = end the run, "wait" = sleep wait_minutes, then check again
wait_minutes = 30

[vision]
threshold = 0.85
search_margin_px = 40
