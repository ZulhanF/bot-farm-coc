<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Bot Farm COC — vision-driven auto-farming for Android emulators">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#16213e"/>
      <stop offset="1" stop-color="#1f1440"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f5b82e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5b82e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e0941a"/>
    </linearGradient>
    <linearGradient id="elixir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1a7ff"/>
      <stop offset="1" stop-color="#a335d6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd76a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- isometric "village" diamond with deploy lines -->
  <g transform="translate(1000 160)">
    <polygon points="0,-120 200,0 0,120 -200,0" fill="#2e7d32" fill-opacity="0.18" stroke="#7bd88f" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="0,-80 134,0 0,80 -134,0" fill="none" stroke="#7bd88f" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 6"/>
    <!-- deploy points along the top-left / top-right edges -->
    <g fill="#ff5a5f">
      <circle cx="-40" cy="-96" r="5"/><circle cx="-80" cy="-72" r="5"/><circle cx="-120" cy="-48" r="5"/><circle cx="-160" cy="-24" r="5"/>
      <circle cx="40" cy="-96" r="5"/><circle cx="80" cy="-72" r="5"/><circle cx="120" cy="-48" r="5"/><circle cx="160" cy="-24" r="5"/>
    </g>
    <!-- detection boxes -->
    <rect x="-48" y="-20" width="44" height="36" rx="4" fill="none" stroke="#4fc3f7" stroke-width="2.5"/>
    <text x="-48" y="-26" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4fc3f7">gold 0.97</text>
    <rect x="18" y="10" width="44" height="36" rx="4" fill="none" stroke="#4fc3f7" stroke-width="2.5"/>
    <text x="18" y="62" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4fc3f7">elixir 0.95</text>
    <!-- storages -->
    <circle cx="-26" cy="-2" r="13" fill="url(#gold)"/>
    <path d="M40 16 C 52 30, 52 40, 40 40 C 28 40, 28 30, 40 16 Z" fill="url(#elixir)"/>
    <!-- crosshair -->
    <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" fill="none">
      <circle cx="0" cy="0" r="58"/>
      <line x1="-74" y1="0" x2="-62" y2="0"/><line x1="62" y1="0" x2="74" y2="0"/>
      <line x1="0" y1="-74" x2="0" y2="-62"/><line x1="0" y1="62" x2="0" y2="74"/>
    </g>
  </g>

  <!-- title block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="132" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="1">Bot Farm COC</text>
    <text x="76" y="180" font-size="26" fill="#c9d3ea">Vision-driven auto-farming for Android emulators</text>
    <g font-size="17" font-weight="600">
      <rect x="76" y="214" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="124" y="237" text-anchor="middle" fill="#e6ecff">ADB</text>
      <rect x="184" y="214" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="244" y="237" text-anchor="middle" fill="#e6ecff">OpenCV</text>
      <rect x="316" y="214" width="138" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="385" y="237" text-anchor="middle" fill="#e6ecff">RapidOCR</text>
      <rect x="466" y="214" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="546" y="237" text-anchor="middle" fill="#e6ecff">Python 3.12</text>
    </g>
  </g>
</svg>
